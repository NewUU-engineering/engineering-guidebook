# =============================================================================
# Engineering Guidebook — School of Engineering, New Uzbekistan University
#
# Theme and design come from:
#   https://github.com/NewUU-engineering/newuu-docs-template
#
# Everything below the CHANGE THESE block is the theme. It should not need
# editing, and if you find yourself editing it, that is worth a conversation
# first: the point of the template is that nobody makes design decisions twice.
# =============================================================================

# --- CHANGE THESE ------------------------------------------------------------
site_name: Engineering Guidebook
site_description: A guidebook to the School of Engineering at New Uzbekistan University — what we aim at, how we get there, and what it means in practice
site_url: https://newuu-engineering.github.io/engineering-guidebook/
repo_url: https://github.com/NewUU-engineering/engineering-guidebook
repo_name: NewUU-engineering/engineering-guidebook
# -----------------------------------------------------------------------------

edit_uri: edit/main/docs/
copyright: School of Engineering, New Uzbekistan University

theme:
  name: material
  custom_dir: overrides   # footer lockup; see overrides/partials/copyright.html
  language: en
  # No `logo:` on purpose. Material always wraps the logo in a home LINK, and
  # the brand rule should be a mark, not a button. It is drawn instead as a
  # ::before on the header title (newuu.css §12.11), which is decoration only
  # and is present at every breakpoint. assets/newuu-mark.svg is kept for
  # social cards and external use.
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans      # full Cyrillic + Latin Extended (Uzbek o', g', ʻ)
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # ONE icon toggles the scheme — not a light/dark pair of buttons
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch theme
    - media: "(prefers-color-scheme: light)"
      scheme: newuu
      toggle:
        icon: material/brightness-7
        name: Switch theme
    - media: "(prefers-color-scheme: dark)"
      scheme: newuu-dark
      toggle:
        icon: material/brightness-4
        name: Switch theme
  features:
    - navigation.sections    # flattens the drawer: no sliding sub-levels
    - navigation.tracking
    - navigation.top
    - navigation.footer      # previous / next at the foot of the page
    - navigation.indexes
    - navigation.path        # breadcrumbs
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    # navigation.instant is deliberately OFF: it breaks the i18n language
    # switcher, which then sends readers to the home page instead of the
    # same page in the other language.

extra_css:
  - stylesheets/newuu.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  # ++ctrl+alt+del++ -> real keyboard keys.
  #
  # IMPORTANT: pymdownx.keys only renders names it knows. Keyboard keys are in
  # its default map; GAMEPAD AND CONTROLLER BUTTONS ARE NOT. Without the map
  # below, `++l2+b++` is published verbatim as the literal text "++l2+b++" —
  # and it is normally written on a safety callout, which is the worst place in
  # the documentation to be wrong. Add every button your equipment actually has.
  - pymdownx.keys:
      key_map:
        l1: "L1"
        l2: "L2"
        r1: "R1"
        r2: "R2"
        start: "START"
        select: "SELECT"
        home: "HOME"
        dpad-up: "D-pad ↑"
        dpad-down: "D-pad ↓"
        dpad-left: "D-pad ←"
        dpad-right: "D-pad →"
        stick-left: "Left stick"
        stick-right: "Right stick"
  - pymdownx.tabbed:
      alternate_style: true # content.tabs.link does nothing without this
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/includes]   # --8<-- "file.md" pulls from here
  - pymdownx.tasklist:
      custom_checkbox: true
  # Required for :material-*: icons in card grids. Without it the shortcodes
  # render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: Engineering Guidebook
          site_description: Путеводитель по Инженерной школе Университета Нового Узбекистана — к чему мы стремимся, как этого добиваемся и что это значит на практике
          nav_translations:
            Introduction: Введение
            What we aim at: К чему мы стремимся
            How we get there: Как мы этого добиваемся
            In practice: На практике
            Academic ethics: Академическая этика
            Small groups and projects: Малые группы и проекты
            Passing a course: Как пройти дисциплину
            Working with AI tools: Работа с ИИ-инструментами
            Safety is part of the culture: Безопасность — часть культуры
            Advice for your years here: Советы на годы учёбы
            For instructors: Рекомендации преподавателям
            Contributing: Как участвовать

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NewUU-engineering

# docs/includes/ holds snippet fragments pulled in with --8<--. They are not
# pages, so keep them out of the build and out of the "not in nav" warning.
exclude_docs: |
  includes/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Introduction: index.md
  - What we aim at: orientations.md
  - How we get there: methods.md
  - In practice:
      - Academic ethics: ethics.md
      - Small groups and projects: groups.md
      - Passing a course: courses.md
      - Working with AI tools: ai-tools.md
      - Safety is part of the culture: safety.md
      - Advice for your years here: advice.md
      - For instructors: teaching.md
  - Contributing: contributing.md
